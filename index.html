<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CINEMAX | Watch Anything, Anywhere</title>
    <meta
      name="description"
      content="Browse trending movies, search the full catalog, and preview trailers instantly."
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap (used for the modal + collapse behavior) -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Tailwind (used for utility layout/spacing) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#0B0B0C",
              panel: "#161618",
              crimson: "#E10600",
              crimsondeep: "#8B0000",
            },
            fontFamily: {
              display: ['"Bebas Neue"', "sans-serif"],
              body: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-ink text-white font-body antialiased">
    <!-- ============ NAVBAR ============ -->
    <nav
      id="mainNav"
      class="fixed top-0 left-0 w-full z-50 transition-all duration-300 px-5 md:px-12 py-4 flex items-center justify-between"
    >
      <div class="flex items-center gap-8">
        <a
          href="#home"
          class="font-display text-3xl tracking-wide text-crimson leading-none select-none"
          >CINEMAX</a
        >
        <ul class="hidden lg:flex items-center gap-6 text-sm text-gray-200">
          <li><a href="#home" class="nav-link">Home</a></li>
          <li><a href="#trending" class="nav-link">Trending</a></li>
          <li><a href="#toprated" class="nav-link">Top Rated</a></li>
          <li><a href="#genres" class="nav-link">Genres</a></li>
        </ul>
      </div>

      <div class="flex items-center gap-4">
        <div class="relative">
          <button
            id="searchToggle"
            aria-label="Toggle search"
            class="w-9 h-9 grid place-items-center rounded-full hover:bg-white/10 transition"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21 21l-4.35-4.35m1.35-5.15a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>
          </button>
          <div
            id="searchBox"
            class="hidden absolute right-0 mt-3 w-[280px] sm:w-[360px] bg-panel/95 backdrop-blur border border-white/10 rounded-lg shadow-2xl p-3"
          >
            <input
              id="searchInput"
              type="text"
              placeholder="Search titles..."
              class="w-full bg-transparent border-b border-white/20 focus:border-crimson outline-none py-2 text-sm placeholder-gray-500 text-white"
            />
            <div
              id="searchResults"
              class="max-h-[60vh] overflow-y-auto mt-3 space-y-2"
            ></div>
          </div>
        </div>

        <button
          id="navToggle"
          class="lg:hidden w-9 h-9 grid place-items-center"
          aria-label="Open menu"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-6 h-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>
      </div>
    </nav>

    <!-- Mobile menu -->
    <div
      id="mobileMenu"
      class="hidden fixed inset-0 bg-ink/98 z-40 flex flex-col items-center justify-center gap-8 text-2xl font-display tracking-wide"
    >
      <a href="#home" class="mobile-link">Home</a>
      <a href="#trending" class="mobile-link">Trending</a>
      <a href="#toprated" class="mobile-link">Top Rated</a>
      <a href="#genres" class="mobile-link">Genres</a>
    </div>

    <!-- ============ HERO ============ -->
    <header
      id="home"
      class="relative h-[92vh] min-h-[560px] w-full flex items-end overflow-hidden"
    >
      <div
        id="heroBackdrop"
        class="absolute inset-0 bg-cover bg-center scale-105"
      ></div>
      <div class="absolute inset-0 hero-gradient"></div>

      <div
        class="relative z-10 px-5 md:px-12 pb-16 md:pb-24 max-w-2xl"
        id="heroContent"
      >
        <p
          id="heroTag"
          class="text-crimson text-sm font-semibold tracking-[0.15em] mb-3 uppercase opacity-0"
        ></p>
        <h1
          id="heroTitle"
          class="font-display text-5xl md:text-7xl leading-[0.95] mb-4 opacity-0"
        ></h1>
        <p
          id="heroOverview"
          class="text-gray-300 text-sm md:text-base max-w-lg mb-6 line-clamp-3 opacity-0"
        ></p>
        <div id="heroButtons" class="flex items-center gap-3 opacity-0">
          <button
            id="heroPlayBtn"
            class="flex items-center gap-2 bg-white text-black font-semibold px-6 py-2.5 rounded hover:bg-white/85 transition"
          >
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" />
            </svg>
            Play Trailer
          </button>
          <button
            id="heroInfoBtn"
            class="flex items-center gap-2 bg-white/20 backdrop-blur font-semibold px-6 py-2.5 rounded hover:bg-white/30 transition"
          >
            More Info
          </button>
        </div>
      </div>
    </header>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="relative z-10 -mt-10 md:-mt-16 pb-24 space-y-12">
      <section id="trending" class="row-section">
        <h2 class="row-heading">Trending Now</h2>
        <div class="row-track" data-category="trending"></div>
      </section>

      <section id="popular" class="row-section">
        <h2 class="row-heading">Popular on Cinemax</h2>
        <div class="row-track" data-category="popular"></div>
      </section>

      <section id="toprated" class="row-section">
        <h2 class="row-heading">Top Rated</h2>
        <div class="row-track" data-category="toprated"></div>
      </section>

      <section id="genres" class="space-y-12">
        <div class="row-section">
          <h2 class="row-heading">Action &amp; Adventure</h2>
          <div class="row-track" data-category="action"></div>
        </div>
        <div class="row-section">
          <h2 class="row-heading">Comedies</h2>
          <div class="row-track" data-category="comedy"></div>
        </div>
        <div class="row-section">
          <h2 class="row-heading">Horror</h2>
          <div class="row-track" data-category="horror"></div>
        </div>
        <div class="row-section">
          <h2 class="row-heading">Romance</h2>
          <div class="row-track" data-category="romance"></div>
        </div>
      </section>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer
      class="px-5 md:px-12 py-10 border-t border-white/10 text-gray-500 text-sm"
    >
      <p>
        Built by Sairaj — data courtesy of
        <a
          href="https://www.omdbapi.com/"
          target="_blank"
          rel="noopener"
          class="underline hover:text-gray-300"
          >OMDb API</a
        >
        and
        <a
          href="https://developers.google.com/youtube/v3"
          target="_blank"
          rel="noopener"
          class="underline hover:text-gray-300"
          >YouTube</a
        >. Not affiliated with Netflix.
      </p>
    </footer>

    <!-- ============ TRAILER MODAL (Bootstrap) ============ -->
    <div class="modal fade" id="trailerModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-panel border border-white/10">
          <div class="modal-header border-white/10">
            <h5
              class="modal-title font-display tracking-wide text-xl"
              id="trailerModalLabel"
            >
              Trailer
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body p-0">
            <div class="ratio ratio-16x9" id="trailerFrameWrap">
              <div
                class="flex items-center justify-center text-gray-400 text-sm"
              >
                Loading trailer…
              </div>
            </div>
          </div>
          <div class="modal-body">
            <p id="trailerOverview" class="text-gray-300 text-sm"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS bundle (modal + collapse) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="js/mock-data.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
